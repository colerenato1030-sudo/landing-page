<style>

    --pearl: #EDE7E0;

    --cognac: #B07D4A;
    --font-display: 'Cormorant Garamond', 'Didot', Georgia, serif;
    --font-body: 'Jost', 'Futura', system-ui, sans-serif;

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Scrim: deepens the left so type holds, leaves the silk and the
     lamp glow untouched on the right. */
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(100deg, rgba(8,8,10,0.94) 0%, rgba(8,8,10,0.72) 34%, rgba(8,8,10,0.12) 62%, transparent 78%),
      linear-gradient(to bottom, rgba(8,8,10,0.55) 0%, transparent 22%);
  }

  /* ---- nav ---- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-block: 28px;
    flex-wrap: wrap;
  }

  .mark {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    text-indent: 0.34em;
    color: var(--pearl);
  }

  .nav-links {
    display: flex;
    gap: clamp(20px, 3vw, 44px);
    list-style: none;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .nav-links a {
    color: var(--pearl-dim);
    text-decoration: none;
    padding-block: 4px;
    border-bottom: 1px solid transparent;
    transition: color 0.3s, border-color 0.3s;
  }

  .nav-links a:hover,
  .nav-links a:focus-visible {
    color: var(--pearl);
    border-bottom-color: var(--cognac);
  }

  /* ---- content ---- */
  .hero-body {
    display: flex;
    align-items: center;
    padding-block: clamp(48px, 9vw, 104px);
  }

  .stack { max-width: 30rem; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--cognac);
    margin-bottom: clamp(20px, 3vw, 30px);
  }

  .eyebrow::after {
    content: '';
    height: 1px;
    width: 56px;
    background: linear-gradient(90deg, var(--cognac), transparent);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(52px, 9.5vw, 104px);
    line-height: 0.94;
    letter-spacing: -0.015em;
    text-wrap: balance;
    margin-bottom: clamp(22px, 3vw, 30px);
  }

  h1 em {
    font-style: italic;
    color: var(--cognac);
  }

  .lede {
    font-size: clamp(15px, 1.5vw, 17px);
    line-height: 1.65;
    color: var(--pearl-dim);
    max-width: 34ch;
    margin-bottom: clamp(30px, 4vw, 42px);
  }

  .actions { display: flex; gap: 14px; flex-wrap: wrap; }

  .btn {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 15px 34px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
  }

  .btn-solid {
    background: var(--pearl);
    color: var(--ink);
  }

  .btn-solid:hover,
  .btn-solid:focus-visible {
    background: var(--cognac);
    color: var(--pearl);
  }

  .btn-line {
    background: transparent;
    color: var(--pearl);
    border-color: rgba(237, 231, 224, 0.32);
  }

  .btn-line:hover,
  .btn-line:focus-visible {
    border-color: var(--cognac);
    color: var(--cognac);
  }

  :focus-visible { outline: 2px solid var(--cognac); outline-offset: 3px; }

  /* ---- footer strip: the brand's actual claims ---- */
  .strip {
    display: flex;
    gap: clamp(20px, 4vw, 56px);
    flex-wrap: wrap;
    padding-block: 24px 32px;
    border-top: 1px solid rgba(237, 231, 224, 0.14);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--pearl-dim);
  }

  @media (max-width: 860px) {
    /* Type moves off the photo's left edge and onto a full scrim,
       since there's no room for a side-by-side read. */
    .hero::before { background-position: 50% 46%; }
    .hero::after {
      background:
        linear-gradient(to bottom, rgba(8,8,10,0.92) 0%, rgba(8,8,10,0.70) 46%, rgba(8,8,10,0.34) 100%);
    }
    .stack { max-width: none; }
    .lede { max-width: 40ch; }
  }

  @media (max-width: 460px) {
    .nav-links { gap: 18px; font-size: 11px; }
    .btn { flex: 1 1 100%; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
