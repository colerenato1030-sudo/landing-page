<svg xmlns="http://www.w3.org/2000/svg" viewBox="300 40 800 1170" width="800" height="1170" role="img" aria-label="Two players standing back to back, one with a racket and one with a paddle">
  <!--
    PLACEHOLDER SUBJECT.
    Swap this for the transparent-background cut-out of the two players
    (assets/hero-players.webp / .png). Keep the same footprint: figures
    standing on the bottom edge of the canvas, generous empty space at the
    top so the display type can read through behind them.
  -->
  <defs>
    <filter id="contact" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ground contact shadow -->
  <ellipse cx="712" cy="1186" rx="330" ry="26" fill="#062a56" opacity=".3" filter="url(#contact)"/>

  <!-- ================= player one — racket ================= -->
  <g fill="#16304f">
    <!-- racket -->
    <g transform="rotate(-20 392 150)">
      <ellipse cx="392" cy="150" rx="56" ry="76" fill="none" stroke="#16304f" stroke-width="15"/>
      <path d="M383 226h18v54h-18z"/>
    </g>
    <path d="M410 250c14 10 24 20 34 32l-24 22c-10-14-20-26-32-36z"/>

    <!-- raised arm -->
    <path d="M492 400c-30-18-58-64-76-124l42-22c17 54 40 94 68 114z"/>
    <!-- ponytail -->
    <path d="M594 266c48-16 78 34 66 94-10 50-40 68-48 108 28-42 20-92 8-132-8-35-16-55-26-70z"/>
    <!-- head + neck -->
    <ellipse cx="560" cy="300" rx="47" ry="57"/>
    <path d="M545 344h30v46h-30z"/>
    <!-- torso -->
    <path d="M490 412c15-24 40-40 70-40s55 16 70 40l15 148c5 50-5 85-13 108H488c-8-23-18-58-13-108z"/>
    <!-- trailing arm -->
    <path d="M628 396c32 14 44 74 40 144-3 60-12 100-20 128l-32-8c10-50 18-120 14-190z"/>
    <!-- skirt -->
    <path d="M482 652h156l30 138c-68 16-148 16-216 0z"/>
    <!-- legs -->
    <path d="M498 782h68c-2 138-4 274-6 408h-52c-4-136-8-272-10-408z"/>
    <path d="M574 782h72c-2 138-6 274-8 408h-52c-4-136-8-272-12-408z"/>
  </g>

  <!-- ================= player two — paddle ================= -->
  <g fill="#0d1c30">
    <!-- paddle -->
    <g transform="rotate(12 1024 536)">
      <rect x="976" y="468" width="96" height="136" rx="42"/>
      <rect x="1012" y="598" width="24" height="70" rx="11"/>
    </g>
    <!-- hair + head + neck -->
    <path d="M800 268c-6-58 24-92 54-92s60 32 54 92c-10-30-30-44-54-44s-44 14-54 44z"/>
    <ellipse cx="854" cy="278" rx="50" ry="60"/>
    <path d="M836 322h36v50h-36z"/>
    <!-- torso -->
    <path d="M752 418c20-30 56-52 102-52s82 22 102 52l10 162c4 50-4 80-12 102H754c-8-22-16-52-12-102z"/>
    <!-- crossed arms -->
    <rect x="754" y="506" width="204" height="48" rx="24" transform="rotate(-8 856 530)"/>
    <rect x="762" y="552" width="192" height="46" rx="23" transform="rotate(6 858 575)"/>
    <!-- shorts -->
    <path d="M748 670h208l-10 162h-80l-14-72-14 72h-80z"/>
    <!-- legs -->
    <path d="M762 820h76c-2 124-4 248-6 370h-56c-6-124-10-246-14-370z"/>
    <path d="M866 820h76c-4 124-8 246-14 370h-56c-2-122-4-246-6-370z"/>
  </g>
</svg>
